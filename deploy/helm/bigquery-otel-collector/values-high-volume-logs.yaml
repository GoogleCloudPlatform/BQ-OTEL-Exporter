# High-volume access/edge log analytics preset (20+ TB/day = 231.5 MB/s).
#
# Usage:
#   helm install otel-collector deploy/helm/bigquery-otel-collector \
#     -f deploy/helm/bigquery-otel-collector/values-high-volume-logs.yaml \
#     --set bigquery.project=my-project
#
# Resource-bag trimming guidance (ADR-18):
#   On trace-less access logs, the repeated per-row `resource` attribute bag is
#   typically the single largest wire-byte contributor (31-58% of encoded
#   ProtoRows). Drop unused host, container, and Kubernetes pod metadata with
#   upstream OTel resourceprocessor / attributesprocessor / transformprocessor
#   before exporting to BigQuery so only query-essential resource keys remain.
#
# Log identity & retry-dedup guidance (ADR-07):
#   - Supply an upstream ID (logging.googleapis.com/insertId, gcp.insert.id,
#     gcp.insert_id, log.record.uid, or logs.insert_id_attribute) for zero-hash
#     fast-path ingestion.
#   - Otherwise keep synthesizeInsertID: true for compact 26 B "id1:" retry
#     deduplication, or explicitly set bigquery.logs.synthesizeInsertID: false if
#     your ID-less access-log pipeline accepts NULL insert_id without retry dedup.

bigquery:
  logs:
    partitionExpirationDays: 30
    requirePartitionFilter: true
    synthesizeInsertID: true

# Storage Write API concurrency & adaptive AIMD backpressure.
# Wire BigQuery adaptive backpressure_level and quota exhaustion metrics as
# alerts ONLY; never feed them into HPA/KEDA scaling.
write:
  streamPoolSize: 8
  backpressure:
    enabled: true

# Queue batching (sending_queue.batch) is OFF by default in the exporter
# (because sending_queue.batch is unset by default). Enable it explicitly here
# to coalesce small OTLP log batches before export, while keeping maxSize: 0
# (unbounded). Setting maxSize > 0 splits batches BEFORE transform.LogRows,
# resetting intra-batch synthesized insert_id ordinals across split boundaries
# and collapsing identical ID-less logs in otel_logs_dedup. Post-transform
# request-byte splitting (write.max_request_bytes) still bounds every
# AppendRows RPC safely; only set maxSize > 0 when bigquery.logs.synthesizeInsertID
# is false and upstream records carry unique insert IDs.
sendingQueue:
  numConsumers: 8
  queueSize: 10000
  sizer: items
  batch:
    enabled: true
    flushTimeout: 200ms
    sizer: items
    minSize: 1000
    maxSize: 0

# Per-pod StatefulSet PVC persistence so HPA scale-up replicas never contend on
# a single ReadWriteOnce claim. Note that exporterhelper v0.165.0 persistent
# queues stop reading immediately on Shutdown rather than draining during
# terminationGracePeriodSeconds (which bounds in-flight AppendRows completion),
# so automatic HPA scale-down is disabled below.
persistentQueue:
  enabled: true
  size: 20Gi
  mountPath: /var/lib/otel/queue

persistence:
  enabled: false

terminationGracePeriodSeconds: 900

# Safe autoscaling (ADR-19): scale out strictly on pod CPU utilization, admitted
# input rate (via a metrics adapter applying rate() over the cumulative counter
# otelcol_receiver_accepted_log_records), and/or sending_queue depth
# (otelcol_exporter_queue_size) with a hard maxReplicas cap.
# Never scale on adaptive backpressure_level.
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 24
  targetCPUUtilizationPercentage: 65
  admittedRateMetric:
    enabled: false
    # Cumulative counter; configure your metrics adapter with rate(...[2m])
    # before enabling (see deploy/README.md).
    name: otelcol_receiver_accepted_log_records
    targetAverageValue: "10000"
  queueDepthMetric:
    enabled: false
    name: otelcol_exporter_queue_size
    targetAverageValue: "500"
  behavior:
    scaleDownStabilizationWindowSeconds: 300
    scaleDown:
      # Disabled because persistent bbolt queues in exporterhelper v0.165.0
      # stop reading immediately on pod Shutdown without draining. Under
      # destination slowdowns CPU can drop while backlog grows, and automatic
      # scale-down would strand queued data on the removed StatefulSet ordinal's
      # PVC until that ordinal scales back up. Scale down manually after
      # confirming otelcol_exporter_queue_size == 0 (note: lowering maxReplicas
      # below the current replica count or setting autoscaling.enabled=false
      # while scaled out bypasses selectPolicy: Disabled and scales down
      # immediately, stranding unshipped PVC data unless replicas are drained first).
      selectPolicy: Disabled

resources:
  requests:
    cpu: "2"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 4Gi

goMemLimit: "3200MiB"
