{{- /*
Bind each optional values block this template reads once with `default dict`:
bigquery and its traces, logs, and metrics blocks, offload, quarantine,
redaction, write and write.backpressure, sendingQueue and sendingQueue.batch,
healthCheck, persistence, and persistentQueue. A block that is missing (a
release installed before it existed, upgraded with `helm upgrade
--reuse-values`) or set to null then renders as empty instead of failing on a
nil pointer. Helm v3.4.1 evaluates every argument of `and`/`or`, so a `hasKey`
guard in front of a lookup in the same `and` does not protect it. receivers,
which holds the required OTLP ports, is read directly, and
persistentQueue.mountPath is read through .Values only behind the guard below.
*/ -}}
{{- $bigquery := .Values.bigquery | default dict -}}
{{- $traces := $bigquery.traces | default dict -}}
{{- $logs := $bigquery.logs | default dict -}}
{{- $metrics := $bigquery.metrics | default dict -}}
{{- $offload := .Values.offload | default dict -}}
{{- $quarantine := .Values.quarantine | default dict -}}
{{- $redaction := .Values.redaction | default dict -}}
{{- $healthCheck := .Values.healthCheck | default dict -}}
{{- $write := .Values.write | default dict -}}
{{- $backpressure := $write.backpressure | default dict -}}
{{- $sendingQueue := .Values.sendingQueue | default dict -}}
{{- $batch := $sendingQueue.batch | default dict -}}
{{- $persistence := .Values.persistence | default dict -}}
{{- $persistentQueue := .Values.persistentQueue | default dict -}}
{{- /* Only a case-insensitive "false" turns synthesis off, here and where synthesize_insert_id is rendered below. */ -}}
{{- $synthLogID := not (and (hasKey $logs "synthesizeInsertID") (eq (lower (printf "%v" $logs.synthesizeInsertID)) "false")) -}}
{{- if and (or $persistentQueue.enabled $persistence.enabled) (not $persistentQueue.mountPath) -}}
{{- fail "persistentQueue.mountPath must be set when persistentQueue.enabled or persistence.enabled is true: the file_storage extension keeps the queue in that directory" -}}
{{- end -}}
{{- if $batch.enabled -}}
{{- $batchMinSize := 0 -}}
{{- if and (hasKey $batch "minSize") (ne (printf "%v" $batch.minSize) "<nil>") (ne (printf "%v" $batch.minSize) "") -}}
{{- $batchMinSize = int $batch.minSize -}}
{{- end -}}
{{- $batchMaxSize := 0 -}}
{{- if and (hasKey $batch "maxSize") (ne (printf "%v" $batch.maxSize) "<nil>") (ne (printf "%v" $batch.maxSize) "") -}}
{{- $batchMaxSize = int $batch.maxSize -}}
{{- end -}}
{{- if lt $batchMinSize 0 -}}
{{- fail (printf "sendingQueue.batch.minSize (%d) must be non-negative" $batchMinSize) -}}
{{- end -}}
{{- if lt $batchMaxSize 0 -}}
{{- fail (printf "sendingQueue.batch.maxSize (%d) must be non-negative" $batchMaxSize) -}}
{{- end -}}
{{- if and (gt $batchMaxSize 0) $synthLogID -}}
{{- fail "sendingQueue.batch.maxSize > 0 splits log batches before transform.LogRows and resets synthesized insert_id ordinals across splits; leave sendingQueue.batch.maxSize at 0 (write.max_request_bytes still bounds AppendRows) or set bigquery.logs.synthesizeInsertID=false when records carry explicit upstream insert IDs" -}}
{{- end -}}
{{- if and (gt $batchMaxSize 0) (gt $batchMinSize $batchMaxSize) -}}
{{- fail (printf "sendingQueue.batch.maxSize (%d) must be greater than or equal to sendingQueue.batch.minSize (%d)" $batchMaxSize $batchMinSize) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bigquery-otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.receivers.grpc.port }}
          http:
            endpoint: 0.0.0.0:{{ .Values.receivers.http.port }}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        timeout: 5s
        send_batch_size: 1000

    exporters:
      bigquery:
        project: ${env:BQ_PROJECT}
        dataset: ${env:BQ_DATASET}
        location: ${env:BQ_LOCATION}
        auto_create:
          dataset: {{ $bigquery.autoCreateDataset }}
          tables: {{ $bigquery.autoCreateTables }}
          {{- if $bigquery.autoCreateCompanionViews }}
          companion_views: {{ $bigquery.autoCreateCompanionViews }}
          {{- end }}
          {{- if $bigquery.autoCreateAllowUnprunableViews }}
          allow_unprunable_views: {{ $bigquery.autoCreateAllowUnprunableViews }}
          {{- end }}
          {{- if $bigquery.autoCreateSearchIndexes }}
          search_indexes: {{ $bigquery.autoCreateSearchIndexes }}
          {{- end }}
        traces:
          table: {{ $bigquery.tracesTable | quote }}
          {{- if $traces.partitionGranularity }}
          partition_granularity: {{ $traces.partitionGranularity | quote }}
          {{- end }}
          {{- with $traces.clustering }}
          clustering:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $traces.partitionExpirationDays }}
          partition_expiration_days: {{ $traces.partitionExpirationDays }}
          {{- end }}
          {{- if $traces.requirePartitionFilter }}
          require_partition_filter: {{ $traces.requirePartitionFilter }}
          {{- end }}
          {{- if $traces.kmsKeyName }}
          kms_key_name: {{ $traces.kmsKeyName | quote }}
          {{- end }}
          {{- with $traces.labels }}
          labels:
            {{- range $k, $v := . }}
            {{ $k | quote }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if $traces.maxStaleness }}
          max_staleness: {{ $traces.maxStaleness | quote }}
          {{- end }}
          {{- with $traces.searchIndex }}
          {{- if or .columns .analyzer }}
          search_index:
            {{- with .columns }}
            columns:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
            {{- if .analyzer }}
            analyzer: {{ .analyzer | quote }}
            {{- end }}
          {{- end }}
          {{- end }}
        logs:
          table: {{ $bigquery.logsTable | quote }}
          {{- if $logs.partitionGranularity }}
          partition_granularity: {{ $logs.partitionGranularity | quote }}
          {{- end }}
          {{- with $logs.clustering }}
          clustering:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $logs.partitionExpirationDays }}
          partition_expiration_days: {{ $logs.partitionExpirationDays }}
          {{- end }}
          {{- if $logs.requirePartitionFilter }}
          require_partition_filter: {{ $logs.requirePartitionFilter }}
          {{- end }}
          {{- if $logs.kmsKeyName }}
          kms_key_name: {{ $logs.kmsKeyName | quote }}
          {{- end }}
          {{- with $logs.labels }}
          labels:
            {{- range $k, $v := . }}
            {{ $k | quote }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if $logs.maxStaleness }}
          max_staleness: {{ $logs.maxStaleness | quote }}
          {{- end }}
          {{- if not $synthLogID }}
          synthesize_insert_id: false
          {{- end }}
          {{- with $logs.searchIndex }}
          {{- if or .columns .analyzer }}
          search_index:
            {{- with .columns }}
            columns:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
            {{- if .analyzer }}
            analyzer: {{ .analyzer | quote }}
            {{- end }}
          {{- end }}
          {{- end }}
        metrics:
          table: {{ $bigquery.metricsTable | quote }}
          {{- if $metrics.partitionGranularity }}
          partition_granularity: {{ $metrics.partitionGranularity | quote }}
          {{- end }}
          {{- with $metrics.clustering }}
          clustering:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $metrics.partitionExpirationDays }}
          partition_expiration_days: {{ $metrics.partitionExpirationDays }}
          {{- end }}
          {{- if $metrics.requirePartitionFilter }}
          require_partition_filter: {{ $metrics.requirePartitionFilter }}
          {{- end }}
          {{- if $metrics.kmsKeyName }}
          kms_key_name: {{ $metrics.kmsKeyName | quote }}
          {{- end }}
          {{- with $metrics.labels }}
          labels:
            {{- range $k, $v := . }}
            {{ $k | quote }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if $metrics.maxStaleness }}
          max_staleness: {{ $metrics.maxStaleness | quote }}
          {{- end }}
          {{- with $metrics.searchIndex }}
          {{- if or .columns .analyzer }}
          search_index:
            {{- with .columns }}
            columns:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
            {{- if .analyzer }}
            analyzer: {{ .analyzer | quote }}
            {{- end }}
          {{- end }}
          {{- end }}
        {{- if $bigquery.kmsKeyName }}
        kms_key_name: {{ $bigquery.kmsKeyName | quote }}
        {{- end }}
        {{- with $bigquery.labels }}
        labels:
          {{- range $k, $v := . }}
          {{ $k | quote }}: {{ $v | quote }}
          {{- end }}
        {{- end }}
        {{- if $offload.enabled }}
        offload:
          enabled: true
          bucket: {{ $offload.bucket | quote }}
          {{- if $offload.prefix }}
          prefix: {{ $offload.prefix | quote }}
          {{- end }}
          {{- if $offload.authorizer }}
          authorizer: {{ $offload.authorizer | quote }}
          {{- end }}
          {{- if $offload.minBytes }}
          min_bytes: {{ $offload.minBytes }}
          {{- end }}
          {{- if $offload.maxObjectBytes }}
          max_object_bytes: {{ $offload.maxObjectBytes }}
          {{- end }}
          {{- if $offload.maxConcurrency }}
          max_concurrency: {{ $offload.maxConcurrency }}
          {{- end }}
          {{- if $offload.timeout }}
          timeout: {{ $offload.timeout | quote }}
          {{- end }}
          {{- /* 0 disables cross-batch caching, so render it; only an unset value falls back to the exporter default. */}}
          {{- if and (hasKey $offload "cacheSize") (ne (printf "%v" $offload.cacheSize) "<nil>") (ne (printf "%v" $offload.cacheSize) "") }}
          cache_size: {{ $offload.cacheSize }}
          {{- end }}
        {{- end }}
        {{- if $quarantine.enabled }}
        quarantine:
          enabled: true
          table: {{ $quarantine.table | quote }}
          {{- if $quarantine.metadataOnly }}
          metadata_only: {{ $quarantine.metadataOnly }}
          {{- end }}
          {{- if $quarantine.maxRawPayloadBytes }}
          max_raw_payload_bytes: {{ $quarantine.maxRawPayloadBytes }}
          {{- end }}
          {{- if $quarantine.timeout }}
          timeout: {{ $quarantine.timeout | quote }}
          {{- end }}
          {{- /* Render an explicit 0 as written; only an unset value is left to the exporter default. */}}
          {{- if and (hasKey $quarantine "partitionExpirationDays") (ne (printf "%v" $quarantine.partitionExpirationDays) "<nil>") (ne (printf "%v" $quarantine.partitionExpirationDays) "") }}
          partition_expiration_days: {{ $quarantine.partitionExpirationDays }}
          {{- end }}
          {{- if $quarantine.requirePartitionFilter }}
          require_partition_filter: {{ $quarantine.requirePartitionFilter }}
          {{- end }}
          {{- if $quarantine.kmsKeyName }}
          kms_key_name: {{ $quarantine.kmsKeyName | quote }}
          {{- end }}
          {{- with $quarantine.labels }}
          labels:
            {{- range $k, $v := . }}
            {{ $k | quote }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if $quarantine.maxStaleness }}
          max_staleness: {{ $quarantine.maxStaleness | quote }}
          {{- end }}
        {{- end }}
        {{- if $redaction.enabled }}
        redaction:
          enabled: true
          {{- with $redaction.blockedKeys }}
          blocked_keys:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $redaction.disableDefaultKeys }}
          disable_default_keys: {{ $redaction.disableDefaultKeys }}
          {{- end }}
          {{- with $redaction.blockedValuePatterns }}
          blocked_value_patterns:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $redaction.maskReplacement }}
          mask_replacement: {{ $redaction.maskReplacement | quote }}
          {{- end }}
          {{- if $redaction.redactLogBody }}
          redact_log_body: {{ $redaction.redactLogBody }}
          {{- end }}
        {{- end }}
        {{- if or $write.streamPoolSize (hasKey $backpressure "enabled") }}
        write:
          {{- if $write.streamPoolSize }}
          stream_pool_size: {{ $write.streamPoolSize }}
          {{- end }}
          {{- if hasKey $backpressure "enabled" }}
          backpressure:
            enabled: {{ $backpressure.enabled }}
          {{- end }}
        {{- end }}
        retry_on_failure:
          enabled: true
          max_elapsed_time: 900s
        sending_queue:
          enabled: true
          {{- if $sendingQueue.sizer }}
          sizer: {{ $sendingQueue.sizer | quote }}
          {{- end }}
          {{- if $sendingQueue.numConsumers }}
          num_consumers: {{ $sendingQueue.numConsumers }}
          {{- end }}
          {{- if $sendingQueue.queueSize }}
          queue_size: {{ $sendingQueue.queueSize }}
          {{- end }}
          {{- if $batch.enabled }}
          batch:
            {{- if $batch.flushTimeout }}
            flush_timeout: {{ $batch.flushTimeout | quote }}
            {{- end }}
            sizer: {{ default "items" $batch.sizer | quote }}
            {{- $renderMinSize := 0 }}
            {{- if and (hasKey $batch "minSize") (ne (printf "%v" $batch.minSize) "<nil>") (ne (printf "%v" $batch.minSize) "") }}
            {{- $renderMinSize = int $batch.minSize }}
            {{- end }}
            min_size: {{ $renderMinSize }}
            {{- if $batch.maxSize }}
            max_size: {{ $batch.maxSize }}
            {{- end }}
          {{- end }}
          {{- if or $persistentQueue.enabled $persistence.enabled }}
          storage: file_storage
          {{- end }}

    {{- /* The mountPath guard at the top fails the render before a directory below can read a missing persistentQueue. */}}
    {{- if $healthCheck.enabled }}
    extensions:
      {{- if or $persistentQueue.enabled $persistence.enabled }}
      file_storage:
        directory: {{ .Values.persistentQueue.mountPath }}
        timeout: 1s
        compaction:
          on_start: true
          # filestorage otherwise compacts in its default directory,
          # /var/lib/otelcol/file_storage, which the read-only image lacks.
          directory: {{ .Values.persistentQueue.mountPath }}
      {{- end }}
      health_check:
        endpoint: 0.0.0.0:{{ $healthCheck.port }}
    {{- else if or $persistentQueue.enabled $persistence.enabled }}
    extensions:
      file_storage:
        directory: {{ .Values.persistentQueue.mountPath }}
        timeout: 1s
        compaction:
          on_start: true
          # filestorage otherwise compacts in its default directory,
          # /var/lib/otelcol/file_storage, which the read-only image lacks.
          directory: {{ .Values.persistentQueue.mountPath }}
    {{- end }}

    service:
      extensions:
        {{- if $healthCheck.enabled }}
        - health_check
        {{- end }}
        {{- if or $persistentQueue.enabled $persistence.enabled }}
        - file_storage
        {{- end }}
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [bigquery]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [bigquery]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [bigquery]
