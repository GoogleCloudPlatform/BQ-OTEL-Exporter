{{- if and .Values.persistence.enabled .Values.persistentQueue.enabled -}}
{{- fail "persistence.enabled and persistentQueue.enabled are mutually exclusive: use persistence.enabled for a single-replica Deployment PVC or persistentQueue.enabled for StatefulSet per-pod volumeClaimTemplates" -}}
{{- end -}}
{{- if and .Values.persistence.enabled .Values.autoscaling.enabled -}}
{{- fail "persistence.enabled cannot be combined with autoscaling.enabled on a Deployment: a single ReadWriteOnce PVC and bbolt file_storage lock cannot be shared across autoscaled replicas; use persistentQueue.enabled=true (StatefulSet) instead" -}}
{{- end -}}
{{- if and .Values.persistence.enabled (gt (int .Values.replicaCount) 1) -}}
{{- fail "persistence.enabled on a Deployment requires replicaCount <= 1 because a single ReadWriteOnce PVC and bbolt file_storage lock cannot be mounted by multiple replicas; use persistentQueue.enabled=true (StatefulSet) for multi-replica persistence" -}}
{{- end -}}
apiVersion: apps/v1
{{- if .Values.persistentQueue.enabled }}
kind: StatefulSet
{{- else }}
kind: Deployment
{{- end }}
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bigquery-otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if .Values.persistentQueue.enabled }}
  serviceName: {{ .Release.Name }}
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistentQueue.enabled) }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bigquery-otel-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: bigquery-otel-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "bigquery-otel-collector.serviceAccountName" . }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otelcol-bq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config=/etc/otel/config.yml"
          env:
            - name: BQ_PROJECT
              value: {{ .Values.bigquery.project | quote }}
            - name: BQ_DATASET
              value: {{ .Values.bigquery.dataset | quote }}
            - name: BQ_LOCATION
              value: {{ .Values.bigquery.location | quote }}
            {{- if .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ .Values.goMemLimit | quote }}
            {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.receivers.grpc.port }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.receivers.http.port }}
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            {{- if .Values.healthCheck.enabled }}
            - name: health
              containerPort: {{ .Values.healthCheck.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.healthCheck.enabled }}
          startupProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
            {{- if or .Values.persistentQueue.enabled .Values.persistence.enabled }}
            - name: file-storage
              mountPath: {{ .Values.persistentQueue.mountPath | quote }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- if and .Values.persistence.enabled (not .Values.persistentQueue.enabled) }}
        - name: file-storage
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-queue" .Release.Name) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistentQueue.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: file-storage
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistentQueue.storageClass }}
        storageClassName: {{ .Values.persistentQueue.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistentQueue.size | quote }}
  {{- end }}
