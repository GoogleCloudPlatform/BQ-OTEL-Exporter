name: Live BigQuery Integration

on:
  schedule:
    - cron: '42 4 * * *'
  workflow_dispatch:
    inputs:
      fail_if_unconfigured:
        description: 'Fail closed if GCP/BigQuery repository variables are missing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  live-integration:
    name: Live BigQuery Integration Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate Live BigQuery configuration
        id: check-config
        env:
          BQ_PROJECT: ${{ vars.BQ_PROJECT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FAIL_IF_UNCONFIGURED: ${{ inputs.fail_if_unconfigured }}
        run: |
          # A variable set to whitespace only is as unusable as an unset one.
          BQ_PROJECT="${BQ_PROJECT:-}"
          GCP_WORKLOAD_IDENTITY_PROVIDER="${GCP_WORKLOAD_IDENTITY_PROVIDER:-}"
          GCP_SERVICE_ACCOUNT="${GCP_SERVICE_ACCOUNT:-}"
          if [ -z "${BQ_PROJECT//[[:space:]]/}" ] || [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER//[[:space:]]/}" ] || [ -z "${GCP_SERVICE_ACCOUNT//[[:space:]]/}" ]; then
            # Only an explicit manual opt-out may end an unconfigured run
            # successfully. Scheduled runs, default manual dispatches, and any
            # other event fail closed so missing configuration is never
            # reported as green evidence.
            if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${FAIL_IF_UNCONFIGURED:-}" = "false" ]; then
              echo "::warning::Live BigQuery integration prerequisites (vars.BQ_PROJECT, vars.GCP_WORKLOAD_IDENTITY_PROVIDER, vars.GCP_SERVICE_ACCOUNT) are not fully configured in repository variables. Skipping live test suite because fail_if_unconfigured=false was requested."
              echo "configured=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Live BigQuery integration prerequisites (vars.BQ_PROJECT, vars.GCP_WORKLOAD_IDENTITY_PROVIDER, vars.GCP_SERVICE_ACCOUNT) are not configured. Scheduled runs and default manual dispatches fail closed; dispatch manually with fail_if_unconfigured=false to skip the live suite explicitly."
              exit 1
            fi
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.check-config.outputs.configured == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.check-config.outputs.configured == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: steps.check-config.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run integration tests (fail-closed via REQUIRE_LIVE_BQ=1)
        if: steps.check-config.outputs.configured == 'true'
        env:
          REQUIRE_LIVE_BQ: "1"
          REQUIRE_LIVE_GCS: ${{ vars.BQ_OFFLOAD_TEST_BUCKET != '' && '1' || '' }}
          BQ_PROJECT: ${{ vars.BQ_PROJECT }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION || 'US' }}
          BQ_OFFLOAD_TEST_BUCKET: ${{ vars.BQ_OFFLOAD_TEST_BUCKET }}
        run: |
          go test -v -race -tags=integration -count=1 -timeout=20m ./...
