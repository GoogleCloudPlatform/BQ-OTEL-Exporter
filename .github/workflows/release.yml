name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest_digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Release binaries carry the standard library they were built with, so
      # build with the same patched Go release example/Dockerfile pins rather
      # than the go.mod minimum, which predates the standard-library fixes.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.3"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # The builder module installs a binary named builder; the GoReleaser
      # hook calls it as ocb. Both live in a job-local directory added to PATH.
      - name: Install OpenTelemetry Collector Builder (ocb)
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          GOBIN="${bin}" GOTOOLCHAIN=local go install go.opentelemetry.io/collector/cmd/builder@v0.164.0
          ln -sf "${bin}/builder" "${bin}/ocb"
          echo "${bin}" >> "${GITHUB_PATH}"
          export PATH="${bin}:${PATH}"
          ocb version
          syft version
          cosign version

      # GoReleaser refuses to release from a checkout with modified tracked
      # files, so the tag goes into a copy of the OCB manifest outside the
      # checkout, and the before hook in .goreleaser.yaml builds from that copy.
      # The release-stamping job in ci.yml replays this step on every change.
      - name: Stamp release version into a copy of the OCB manifest
        id: stamp
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          manifest="${RUNNER_TEMP}/otelcol-builder-release.yaml"
          sed -e "s/version: 0.1.0-dev/version: ${VERSION}/g" \
            -e "s|github.com/GoogleCloudPlatform/BQ-OTEL-Exporter v0.0.0|github.com/GoogleCloudPlatform/BQ-OTEL-Exporter ${RELEASE_TAG}|g" \
            example/otelcol-builder-release.yaml > "${manifest}"
          echo "OCB_RELEASE_MANIFEST=${manifest}" >> "${GITHUB_ENV}"

      - name: Run GoReleaser
        id: build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published manifest digest
        id: manifest_digest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          DIGEST="$(docker buildx imagetools inspect "ghcr.io/googlecloudplatform/bq-otel-collector:${VERSION}" --format '{{ .Manifest.Digest }}')"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Verify signed container manifest
        env:
          DIGEST: ${{ steps.manifest_digest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/GoogleCloudPlatform/BQ-OTEL-Exporter/.github/workflows/release.yml@.*" \
            "ghcr.io/googlecloudplatform/bq-otel-collector@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/googlecloudplatform/bq-otel-collector
          subject-digest: ${{ steps.manifest_digest.outputs.digest }}
          push-to-registry: true

      - name: Attest binary archive build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/checksums.txt"

      - name: Generate and attach container SPDX SBOM
        id: container_sbom
        shell: bash
        env:
          DIGEST: ${{ steps.manifest_digest.outputs.digest }}
        run: |
          IMAGE="ghcr.io/googlecloudplatform/bq-otel-collector"
          # Exclude non-image attestation descriptors (unknown/unknown), and
          # require exactly the platforms published by .goreleaser.yaml.
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw |
            jq -er '.manifests | map(select(.platform.os != "unknown")) |
              if (map(.platform.os + "/" + .platform.architecture) | sort) == ["linux/amd64", "linux/arm64"]
              then .[] | [.platform.os + "/" + .platform.architecture, .digest] | @tsv
              else error("expected one image each for linux/amd64 and linux/arm64") end' > dist/container-platforms.tsv
          while IFS=$'\t' read -r platform child_digest; do
            [[ "${child_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
            sbom="dist/container-${platform//\//-}.spdx.json"
            syft "registry:${IMAGE}@${child_digest}" --platform "${platform}" -o "spdx-json=${sbom}"
            cosign attach sbom --sbom "${sbom}" --type spdx "${IMAGE}@${child_digest}"
            cosign attest --predicate "${sbom}" --type spdxjson --yes "${IMAGE}@${child_digest}"
          done < dist/container-platforms.tsv

  # After the release job publishes binaries, containers, and attestations,
  # verify the Go module is available on the public Go module proxy and that an
  # external consumer can import and build it directly from proxy.golang.org.
  # This runs on both v* tag pushes and workflow_dispatch releases; needs:
  # [release] guarantees the release job succeeded in either case.
  publish-go-package:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: false

      - name: Poll Go module proxy for the published version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG}"
          # GitHub commits and tags take time to propagate to the Go module
          # proxy after the tag push. Retry for up to 5 minutes.
          url="https://proxy.golang.org/github.com/!google!cloud!platform/!b!q-!o!t!e!l-!exporter/@v/${TAG}.info"
          echo "polling ${url}"
          ok=false
          for _ in $(seq 30); do
            if curl -fsS "${url}" > /dev/null; then
              ok=true
              break
            fi
            echo "not yet available, retrying in 10s..."
            sleep 10
          done
          if [ "${ok}" = "false" ]; then
            echo "::error::Go module proxy did not serve ${TAG} within 5 minutes"
            exit 1
          fi
          echo "Go module proxy serves ${TAG}"

      - name: Trigger pkg.go.dev documentation indexing
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG}"
          # Requesting the pkg.go.dev page triggers documentation indexing for
          # newly published versions. A 200 or 404 is acceptable on the first
          # request; the proxy warming above already proved availability.
          curl -fsS "https://pkg.go.dev/github.com/GoogleCloudPlatform/BQ-OTEL-Exporter@${TAG}" > /dev/null || true
          echo "requested pkg.go.dev for ${TAG}"

      - name: Clean-room external consumer smoke test
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG}"
          dir="$(mktemp -d)"
          cd "${dir}"
          go mod init example.com/smoke
          cat > main.go <<EOF
          package main

          import (
            "fmt"
            bigqueryexporter "github.com/GoogleCloudPlatform/BQ-OTEL-Exporter"
          )

          func main() {
            fmt.Println(bigqueryexporter.NewFactory().Type())
          }
          EOF
          GOPROXY=https://proxy.golang.org go get "github.com/GoogleCloudPlatform/BQ-OTEL-Exporter@${TAG}"
          go build -o smoke .
          ./smoke
          echo "external consumer smoke test passed for ${TAG}"
